name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install SDK parts
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # settings.gradle includes :libvlcjni:libvlc, so the folder must exist.
      # Debug builds still use the prebuilt libVLC/medialibrary from Maven.
      - name: Fetch libvlcjni (folder only, not built)
        run: git clone --depth 1 --branch libvlcjni-3.x https://code.videolan.org/videolan/libvlcjni.git libvlcjni

      - name: Build debug APK
        run: gradle :application:app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-glass-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
